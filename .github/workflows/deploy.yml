name: Deploy to AWS

on:
  push:
    branches: [main, deploy]

env:
  AWS_REGION: ap-south-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Backend Deployment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Build Lambda deployment package
        run: |
          cd backend
          mkdir -p lambda_deployment
          pip install -r requirements.txt -t lambda_deployment/
          cp -r app lambda_deployment/
          cp lambda_handler.py lambda_deployment/
          cd lambda_deployment
          zip -r ../lambda_function.zip .

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name bankui-backend-api \
            --zip-file fileb://backend/lambda_function.zip

      # Frontend Deployment
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy to S3
        run: |
          aws s3 sync frontend/dist/ s3://bankui-frontend-prod-${{ secrets.AWS_ACCOUNT_ID }}/ --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Notify deployment
        if: always()
        run: |
          echo "Deployment completed at $(date)"
